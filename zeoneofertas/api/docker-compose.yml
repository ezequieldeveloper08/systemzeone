services:
  mysql:
    image: mysql:8.0
    container_name: ofertahub_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ofertahub
      MYSQL_USER: ofertahub_user
      MYSQL_PASSWORD: ofertahub_pass
    ports:
      - '3307:3306'
    volumes:
      - mysql_api_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dashboard visual para o Banco MySQL (opcional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ofertahub_phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql

volumes:
  mysql_api_data:
